<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор столика и Меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Подключаем премиальный шрифт для меню -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="preload" as="image" href="img/chicken.jpg">
    <link rel="preload" as="image" href="img/burger.jpg">
    <link rel="preload" as="image" href="img/salmon.jpg">
    <link rel="preload" as="image" href="img/lem1.jpg">
    <link rel="preload" as="image" href="img/lem2.jpg">
    <link rel="preload" as="image" href="img/lem3.jpg">
    <link rel="preload" as="image" href="img/tea1.jpg">
    <link rel="preload" as="image" href="img/tea2.jpg">
    <link rel="preload" as="image" href="img/coffee1.jpg">
    <link rel="preload" as="image" href="img/coffee2.jpg">
    <link rel="preload" as="image" href="img/hookah1.jpg">
    <link rel="preload" as="image" href="img/hookah2.jpg">
    <link rel="preload" as="image" href="img/hookah3.jpg">

    <style>
        body { background-color: #1c1c1e; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; padding: 15px; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        h2 { margin-top: 5px; margin-bottom: 20px; font-weight: 600; text-align: center; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #2c2c2e; border-top: 1px solid #3a3a3c; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 12px; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: #007aff; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
        .section { width: 100%; max-width: 360px; display: none; }
        .section.active { display: block; }
        
        /* КАРТА ЗАЛА */
        .floor-plan { position: relative; width: 100%; height: 480px; background-color: #242426; border-radius: 15px; border: 2px solid #3a3a3c; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .room-element { position: absolute; border: 2px solid #555; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #888; background-color: #2c2c2e; }
        .wc { top: 15px; left: 15px; width: 40px; height: 30px; }
        .entrance { bottom: 15px; left: 15px; width: 40px; height: 30px; border-color: #4CAF50; color: #4CAF50;}
        .bar-vertical { bottom: 143px; left: 15px; width: 25px; height: 75px; border-bottom: none; z-index: 2; box-sizing: border-box; }
        .bar-horizontal { bottom: 120px; left: 15px; width: 70px; height: 25px; box-sizing: border-box; z-index: 1; }
        .bar-text { position: absolute; bottom: 95px; left: 15px; font-size: 10px; color: #e5b582; font-weight: bold; width: 70px; text-align: center; }
        .window-line { position: absolute; bottom: 0; height: 6px; background-color: #5ac8fa; border-top-left-radius: 4px; border-top-right-radius: 4px; box-shadow: 0 0 8px #5ac8fa; }
        .w1 { left: 90px; width: 60px; } .w2 { left: 180px; width: 60px; } .w3 { left: 270px; width: 60px; }
        .table-group { position: absolute; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.3s ease; width: 65px; height: 45px; }
        .table-core { background-color: #48484a; border: 2px solid #666; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; transition: all 0.3s ease; width: 30px; height: 45px; border-radius: 6px; }
        .chair { width: 12px; height: 35px; background-color: #4a3b32; border-radius: 5px; }
        #t1 { top: 30px; left: 100px; } #t2 { top: 30px; left: 185px; } #t3 { top: 30px; left: 270px; }
        .window-table { width: 65px; height: 45px; flex-direction: row; }
        .window-table .table-core { width: 35px; height: 30px; }
        .window-table .chair { width: 10px; height: 25px; }
        #t4 { bottom: 20px; left: 88px; } #t5 { bottom: 20px; left: 178px; } #t6 { bottom: 20px; left: 268px; }
        .table-group.selected { transform: scale(1.15); z-index: 10; }
        .table-group.selected .table-core { background-color: #007aff; border-color: #007aff; box-shadow: 0 0 15px rgba(0, 122, 255, 0.8); color: white; }
        
        /* ВЫБОР ВРЕМЕНИ */
        .time-picker { display: none; margin-top: 20px; width: 100%; animation: fadeIn 0.3s ease; }
        .time-picker.active { display: block; }
        .time-picker h3 { margin: 0 0 12px 0; font-size: 16px; text-align: center; color: #e5b582; }
        .time-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .time-chip { padding: 10px 16px; background-color: #2c2c2e; border: 2px solid #3a3a3c; border-radius: 8px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .time-chip.selected { background-color: #007aff; border-color: #007aff; box-shadow: 0 0 10px rgba(0, 122, 255, 0.5); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* ФОРМА КОНТАКТОВ */
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: white; box-sizing: border-box; font-size: 16px; }
        .input-field::placeholder { color: #888; }
        .input-field:focus { outline: none; border-color: #d4b886; }

        /* --- ПРЕМИАЛЬНЫЙ ДИЗАЙН МЕНЮ --- */
        #section-menu h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #d4b886; 
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .menu-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
            padding: 0 10px;
        }

        .menu-card {
            background: linear-gradient(135deg, #2a2a2f 0%, #1c1c1f 100%);
            border: 1px solid rgba(212, 184, 134, 0.3);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .menu-card:active {
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
        }

        .menu-icon {
            font-size: 55px; 
            margin-bottom: 15px;
            filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.5));
            display: block;
        }

        .menu-title {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .menu-price {
            font-family: 'Playfair Display', serif;
            display: inline-block;
            background: transparent;
            color: #d4b886; 
            font-size: 15px;
            font-weight: 400;
            text-transform: lowercase; 
            letter-spacing: 0.5px;
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1c1c1e; z-index: 200; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 30px; animation: slideIn 0.3s forwards; }
        .modal-overlay.active { display: flex; }
        .modal-header { display: flex; align-items: center; padding: 15px 20px; background-color: #2c2c2e; position: sticky; top: 0; z-index: 201; border-bottom: 1px solid #3a3a3c; }
        .back-btn { font-size: 24px; margin-right: 15px; cursor: pointer; color: #007aff; line-height: 1; }
        .modal-title { font-size: 18px; font-weight: bold; }
        .snack-list { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        .snack-card { background-color: #2c2c2e; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .snack-img { width: 100%; height: 220px; object-fit: cover; object-position: left center; display: block; }
        .snack-info { padding: 15px; }
        .snack-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
        .snack-desc { font-size: 14px; color: #b0b0b0; margin-bottom: 15px; line-height: 1.4; }
        .snack-price { font-size: 18px; color: #e5b582; font-weight: bold; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    
    {{template "map" .}}
    {{template "menu" .}}
    {{template "modals" .}}

    <div class="bottom-nav">
        <div class="nav-item active" id="tab-map" onclick="switchTab('map')"><div class="nav-icon">🗺️</div><span>Зал</span></div>
        <div class="nav-item" id="tab-menu" onclick="switchTab('menu')"><div class="nav-icon">🧾</div><span>Меню</span></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let selectedTableName = "";
        let selectedTime = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('start') === 'menu') switchTab('menu');
        };

        function switchTab(tab) {
            document.getElementById('section-map').classList.remove('active');
            document.getElementById('section-menu').classList.remove('active');
            document.getElementById('tab-map').classList.remove('active');
            document.getElementById('tab-menu').classList.remove('active');
            document.getElementById('section-' + tab).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            
            closeSnacks(); 
            closeLemonades();
            closeDrinks();
            closeHookahs();
            
            // Прячем кнопку Telegram при смене вкладок
            tg.MainButton.hide();
        }

        function openHookahs() { document.getElementById('hookahs-modal').classList.add('active'); }
        function closeHookahs() { document.getElementById('hookahs-modal').classList.remove('active'); }
        function openSnacks() { document.getElementById('snacks-modal').classList.add('active'); }
        function closeSnacks() { document.getElementById('snacks-modal').classList.remove('active'); }
        function openLemonades() { document.getElementById('lemonades-modal').classList.add('active'); }
        function closeLemonades() { document.getElementById('lemonades-modal').classList.remove('active'); }
        function openDrinks() { document.getElementById('drinks-modal').classList.add('active'); }
        function closeDrinks() { document.getElementById('drinks-modal').classList.remove('active'); }

        function selectTable(tableName, element) {
    // 1. Снимаем выделение со ВСЕХ столов в документе
    document.querySelectorAll('.table-group').forEach(c => {
        c.classList.remove('selected');
    });

    // 2. Выделяем только тот стол, на который кликнули
    element.classList.add('selected');

    // 3. Сохраняем имя выбранного стола
    selectedTableName = tableName; 

    // Скрываем форму контактов и сбрасываем выбранное время при смене стола
    let contactForm = document.getElementById('contactForm');
    if (contactForm) contactForm.style.display = 'none';
    
    tg.MainButton.hide();
    selectedTime = "";

    // 4. Запрашиваем с сервера занятость для этого стола
    fetch('/api/availability')
        .then(response => response.json())
        .then(data => {
            let takenTimes = data[tableName] || [];
            
            document.querySelectorAll('.time-chip').forEach(chip => {
                let time = chip.innerText.trim(); 
                
                if (takenTimes.includes(time)) {
                    chip.style.backgroundColor = '#4a1515';
                    chip.style.color = '#ff6b6b';
                    chip.style.pointerEvents = 'none';
                    chip.classList.remove('selected');
                    chip.style.opacity = '0.5';
                } else {
                    chip.style.backgroundColor = ''; 
                    chip.style.color = '';
                    chip.style.pointerEvents = 'auto'; 
                    chip.style.opacity = '1';
                }
            });
            
            // Показываем блок со временем
            document.getElementById('timePicker').style.display = 'block';
        })
        .catch(err => {
            tg.showAlert("Не удалось проверить занятость столов");
        });
}

        function selectTime(time, element) {
            selectedTime = time;
            document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            
            // Показываем форму для ввода контактов
            let contactForm = document.getElementById('contactForm');
            if (contactForm) contactForm.style.display = 'block';
            
            // Показываем нативную кнопку Telegram (в золотом стиле!)
            tg.MainButton.text = ("ЗАБРОНИРОВАТЬ НА " + time).toUpperCase();
            tg.MainButton.color = "#d4b886"; // Золотистый цвет кнопки
            tg.MainButton.textColor = "#1c1c1e"; // Темный цвет текста на кнопке
            tg.MainButton.show();
            
            // Скроллим вниз к полям ввода
            setTimeout(() => {
                if (contactForm) contactForm.scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        tg.onEvent('mainButtonClicked', function(){
            const nameEl = document.getElementById('userName');
            const phoneEl = document.getElementById('userPhone');
            
            const name = nameEl ? nameEl.value.trim() : "";
            const phone = phoneEl ? phoneEl.value.trim() : "";

            if (!name || !phone) {
                tg.showAlert("Пожалуйста, заполните имя и телефон!");
                return;
            }

            let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0;
            let username = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.username : "";
            
            tg.MainButton.showProgress();
            
            let payload = { 
                table: selectedTableName, 
                time: selectedTime, 
                userId: userId,
                username: username,
                name: name,
                phone: phone
            };
            
            fetch('/api/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                tg.MainButton.hideProgress();
                if (response.ok) {
                    tg.close();
                } else {
                    tg.showAlert("Ошибка бронирования на сервере");
                }
            }).catch(() => {
                tg.MainButton.hideProgress();
                tg.showAlert("Ошибка соединения с сервером");
            });
        });
    </script>
</body>
</html>
